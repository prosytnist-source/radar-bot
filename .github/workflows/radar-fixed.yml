name: radar-fixed
# Щоденні фіксовані пости: свято 06:00, курс НБУ 06:30, пальне 07:00 (Київ). Хвилина мовчання винесена в radar-silence.yml (точність до секунди).
# Час у UTC для зими (Київ = UTC+2). Навесні, коли годинник переходить на літній час, усі рядки cron зсунути на годину раніше.
# GitHub запускає за розкладом із запізненням 45–60 хв (виміряно 17–18 листопада), тому стоять ранні cron і резервні.
on:
  schedule:
    # Ранні запуски (на 50 хв раніше): GitHub спізнюється на 45–60 хв, тож пост виходить близько цільового часу, а скрипт чекає до нього до 12 хв.
    - cron: "10 3 * * *"   # свято → 06:00 Київ
    - cron: "40 3 * * *"   # курс НБУ → 06:30
    - cron: "10 4 * * *"   # пальне → 07:00
    - cron: "10 9 * * *"   # Визначні постаті → 12:00
    - cron: "10 11 * * *"  # Культурні діячі → 14:00
    - cron: "10 13 * * *"  # Питання дня → 16:00
    - cron: "10 14 * * *"  # Історичний факт → 17:00
    - cron: "10 18 * * *"  # Експертна думка → 21:00
    - cron: "10 19 * * *"  # Кіт дня → 22:00
    # Резервні запуски в «старі» години: якщо ранній пропав, цей підхопить (повторно не опублікує)
    - cron: "0 4 * * *"
    - cron: "30 4 * * *"
    - cron: "0 5 * * *"
    - cron: "0 10 * * *"
    - cron: "0 12 * * *"
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "holiday | rates | fuel | figure | culture | ask | fact | expert | cat | banners"
        default: "rates"
      scene:
        description: "для kind=cat: власна сцена для проби; для kind=banners: ключ одного банера (holiday, rates, fuel, figure, culture, ask, expert, fact) щоб перегенерувати лише його, напр. «кіт дивиться на дощ з кавою» (можна залишити порожнім)"
        default: ""
      force:
        description: "true = надіслати негайно, ігноруючи час і паузу (для перевірки)"
        default: "false"
concurrency:
  group: radar-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Бібліотека для карток
        run: pip install --quiet pillow
      - name: Обрати пост
        id: k
        run: |
          case "${{ github.event.schedule }}" in
            "10 3 * * *"|"0 4 * * *") K=holiday ;;
            "40 3 * * *"|"30 4 * * *") K=rates ;;
            "10 4 * * *"|"0 5 * * *") K=fuel ;;
            "10 9 * * *"|"0 10 * * *") K=figure ;;
            "10 11 * * *"|"0 12 * * *") K=culture ;;
            "10 13 * * *"|"0 14 * * *") K=ask ;;
            "10 14 * * *"|"0 15 * * *") K=fact ;;
            "10 18 * * *"|"0 19 * * *") K=expert ;;
            "10 19 * * *"|"0 20 * * *") K=cat ;;
            *) K="${{ github.event.inputs.kind }}" ;;
          esac
          echo "kind=$K" >> "$GITHUB_OUTPUT"
      - name: Пост
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAT_SCENE: ${{ github.event.inputs.scene }}
        run: |
          F="--wait"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then F="--force"; fi
          python -m digest.fixed --kind "${{ steps.k.outputs.kind }}" $F
      - name: Зберегти стан
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: fixed ${{ steps.k.outputs.kind }}"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Не вдалося зберегти стан (не критично)"
          exit 0
