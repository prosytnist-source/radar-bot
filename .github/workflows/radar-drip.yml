name: radar-drip
# Крапельна подача: не більше одного допису за запуск. GitHub може запізнюватися на кілька хвилин — це нормально.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
concurrency:
  group: radar-state
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Подача
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: python -m digest.drip
      - name: Зберегти стан
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "state: drip" && git pull --rebase && git push)
