name: radar-drip
# Безперервна подача: запуск живе до ~55 хв і кожну хвилину перевіряє чергу, тож запізнення GitHub у кілька хвилин нічого не псують.
# Cron лише «підстраховує» старт; два запуски одночасно не працюють (concurrency), наступний чекає завершення попереднього.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
concurrency:
  group: radar-drip
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Подача (безперервно)
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
        run: python -m digest.drip --loop 55 --git --watch --fixed
