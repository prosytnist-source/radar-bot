name: radar-wipe
# Разове повне очищення каналу. Запускається лише вручну й лише з точним підтвердженням.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Щоб видалити УСІ повідомлення каналу, впишіть: ТАК, ВИДАЛИТИ"
        required: true
permissions:
  contents: read
jobs:
  wipe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Очищення каналу
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: python -m digest.wipe --confirm "$CONFIRM"
